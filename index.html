        .vote-card.voted-active {

        .vote-btn {

        }

        .vote-btn:hover {
            background-color: var(--primary-orange-hover);

        .vote-btn:disabled {

        .vote-btn.voted-btn {

        .winner-banner {

            text-shadow: 0 2px 4px rgba(0,0,0,0.8);

            animation: pulse 2s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.99); opacity: 0.9; }
            100% { transform: scale(1.01); opacity: 1; }
        }

        .rank-row {
            display: flex;
            justify-content: space-between;

            font-size: 0.85rem;
        }
        .rank-row:last-child { border-bottom: none; }

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSw0nzgbHrFCAJLpvmhZwYAV_aQeBMw4g",
            authDomain: "fcbadboys-bfc96.firebaseapp.com",
            projectId: "fcbadboys-bfc96",
            storageBucket: "fcbadboys-bfc96.firebasestorage.app",
            messagingSenderId: "394322712916",
            appId: "1:394322712916:web:8fb96c51cbf2f113e8d0c1",
            measurementId: "G-WT2ECTZ2K0"
        };
                firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const initialPlayers = [
            { id: 1, name: "Eren Yılmaz", position: "Forvet", number: 37, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 2, name: "Murat Çaylı", position: "Forvet", number: 10, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 3, name: "Hüseyin Can Yüksekdağ", position: "Kale", number: 1, goalsConceded: 0, yellowCards: 0, redCards: 0, isGoalKeeper: true, isMvp: false },
            { id: 4, name: "Yakup Sunay", position: "Defans", number: 5, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 5, name: "Süleyman Tunçelik", position: "Defans", number: 3, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 6, name: "Musa Aksu", position: "Kanat", number: 37, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 7, name: "Burak ", position: "Defans", number: 4, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 8, name: "Ahmet", position: "Kale", number: 99, goalsConceded: 0, yellowCards: 0, redCards: 0, isGoalKeeper: true, isMvp: false }
        ];

        const initialMatches = [
            { opponent: "Rakip Takım 1", score: "4 - 2", date: "12.10.2026", status: "Kazandı" },
            { opponent: "Rakip Takım 2", score: "3 - 3", date: "19.10.2026", status: "Berabere" }
        ];

        let isUnlocked = false;
        let players = [];
        let matches = [];
        let votes = {};
        let votingClosed = false;

        db.ref('players').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { players = data; } 
            else { db.ref('players').set(initialPlayers); players = initialPlayers; }
            renderAll();
        });

        db.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { matches = data; } 
            else { db.ref('matches').set(initialMatches); matches = initialMatches; }
            renderMatches();
        });

        db.ref('votes').on('value', (snapshot) => {
            votes = snapshot.val() || {};
            renderVoting();
        });

        db.ref('votingClosed').on('value', (snapshot) => {
            votingClosed = snapshot.val() || false;
            renderVoting();
        });

        function saveData() {
            db.ref('players').set(players);
        }

        function unlockPanel() {
            const pass = document.getElementById('password-input').value;
            const msg = document.getElementById('status-msg');
            const adminControlsTop = document.getElementById('admin-controls-top');
            const addMatchBtn = document.getElementById('add-match-btn');

            if (pass === "Yy++1907") {
                isUnlocked = true;
                msg.style.color = "var(--success)";
                msg.textContent = "Kilit Açıldı! Düzenleme yapabilirsiniz.";
                adminControlsTop.style.display = "flex";
                addMatchBtn.style.display = "inline-block";
                renderAll();
            } else {
                alert("Hatalı Şifre!");
                document.getElementById('password-input').value = "";
            }
        }

        function resetSeason() {
            if (confirm("Tüm oyuncu istatistikleri ve oylamalar sıfırlanacak. Emin misiniz?")) {
                players = initialPlayers.map(p => ({ ...p }));
                saveData();
                db.ref('votes').remove();
                db.ref('votingClosed').set(false);
                localStorage.removeItem("badboys_voted_id");
                alert("Sezon başarıyla sıfırlandı!");
            }
        }

        function downloadData() {
            const exportData = {
                players: players,
                matches: matches,
                votes: votes,
                votingClosed: votingClosed
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "fc_bad_boys_yedek.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function toggleVotingState() {
            if (!isUnlocked) return;
            db.ref('votingClosed').set(!votingClosed);
        }

        function updateStat(id, statType, change) {
            if (!isUnlocked) {
                alert("Önce kaptan şifresiyle kilidi açmalısınız!");
                return;
            }

            const player = players.find(p => p.id === id);
            if (player) {
                if (statType === 'goals') player.goals = Math.max(0, player.goals + change);
                else if (statType === 'assists') player.assists = Math.max(0, player.assists + change);
                else if (statType === 'conceded') player.goalsConceded = Math.max(0, (player.goalsConceded || 0) + change);
                else if (statType === 'yellow') player.yellowCards = Math.max(0, player.yellowCards + change);
                else if (statType === 'red') player.redCards = Math.max(0, player.redCards + change);
                
                saveData();
            }
        }

        function setMvp(id) {
            if (!isUnlocked) return;
            players.forEach(p => p.isMvp = (p.id === id));
            saveData();
        }

        function addMatchModal() {
            const opponent = prompt("Rakip Takım Adı:");
            if (!opponent) return;
            const score = prompt("Skor (Örn: 5 - 2):");
            if (!score) return;
            const date = prompt("Maç Tarihi (Örn: 25.10.2026):", "Bugün");

            matches.push({ opponent, score, date });
            db.ref('matches').set(matches);

            db.ref('votes').remove();
            db.ref('votingClosed').set(false);
            localStorage.removeItem("badboys_voted_id");
        }

        function castVote(newPlayerId) {
            if (votingClosed) {
                alert("Oylama sona ermiştir.");
                return;
            }

            const oldVotedId = localStorage.getItem("badboys_voted_id");

            if (oldVotedId && parseInt(oldVotedId) === newPlayerId) {
                alert("Zaten bu oyuncuya oy verdiniz!");
                return;
            }

            const updates = {};
            
            if (oldVotedId) {
                const currentOldVotes = votes[oldVotedId] || 1;
                updates['votes/' + oldVotedId] = Math.max(0, currentOldVotes - 1);
            }
            
            const currentNewVotes = votes[newPlayerId] || 0;
            updates['votes/' + newPlayerId] = currentNewVotes + 1;

            db.ref().update(updates, (error) => {
                if (!error) {
                    localStorage.setItem("badboys_voted_id", newPlayerId);
                    alert(oldVotedId ? "Oyunuz başarıyla değiştirildi!" : "Oylamanız başarıyla kaydedildi!");
                } else {
                    alert("Oy gönderilirken bir hata oluştu.");
                }
            });
        }

        function renderAll() {
            renderSummary();
            renderPlayers();
            renderLeaderboards();
            renderMatches();
            renderVoting();
        }

        function renderSummary() {
            let totalGoals = players.reduce((sum, p) => sum + (p.goals || 0), 0);
            let totalAssists = players.reduce((sum, p) => sum + (p.assists || 0), 0);
            let totalConceded = players.reduce((sum, p) => sum + (p.goalsConceded || 0), 0);

            document.getElementById('team-summary').innerHTML = `
                <div class="summary-item">Toplam Gol<span>⚽ ${totalGoals}</span></div>
                <div class="summary-item">Toplam Asist<span>🎯 ${totalAssists}</span></div>
                <div class="summary-item">Yenen Gol<span>🥅 ${totalConceded}</span></div>
            `;
        }

        function renderPlayers() {
            const container = document.getElementById('players-list');
            container.innerHTML = players.map(p => `
                <div class="player-card ${p.isMvp ? 'mvp' : ''}">
                    ${p.isMvp ? '<div class="mvp-badge">MVP</div>' : ''}
                    <div class="player-header">
                        <span class="player-name">${p.name}</span>
                        <span class="player-number">#${p.number}</span>
                    </div>
                    <div class="player-details">${p.position}</div>

                    ${!p.isGoalKeeper ? `
                        <div class="stats-row">
                            <span class="stat-label">⚽ Gol</span>
                            <div class="stat-controls">
                                ${isUnlocked ? `<button class="stat-btn minus" onclick="updateStat(${p.id}, 'goals', -1)">-</button>` : ''}
                                <span class="stat-value">${p.goals || 0}</span>
                                ${isUnlocked ? `<button class="stat-btn plus" onclick="updateStat(${p.id}, 'goals', 1)">+</button>` : ''}
                            </div>
                        </div>
                        <div class="stats-row">
                            <span class="stat-label">🎯 Asist</span>
                            <div class="stat-controls">
                                ${isUnlocked ? `<button class="stat-btn minus" onclick="updateStat(${p.id}, 'assists', -1)">-</button>` : ''}
                                <span class="stat-value">${p.assists || 0}</span>
                                ${isUnlocked ? `<button class="stat-btn plus" onclick="updateStat(${p.id}, 'assists', 1)">+</button>` : ''}
                            </div>
                        </div>
                    ` : `
                        <div class="stats-row">
                            <span class="stat-label">🥅 Yenen Gol</span>
                            <div class="stat-controls">
                                ${isUnlocked ? `<button class="stat-btn minus" onclick="updateStat(${p.id}, 'conceded', -1)">-</button>` : ''}
                                <span class="stat-value">${p.goalsConceded || 0}</span>
                                ${isUnlocked ? `<button class="stat-btn plus" onclick="updateStat(${p.id}, 'conceded', 1)">+</button>` : ''}
                            </div>
                        </div>
                    `}

                    <div class="stats-row">
                        <span class="stat-label">🟨 Sarı Kart</span>
                        <div class="stat-controls">
                            ${isUnlocked ? `<button class="stat-btn minus" onclick="updateStat(${p.id}, 'yellow', -1)">-</button>` : ''}
                            <span class="stat-value">${p.yellowCards || 0}</span>
                            ${isUnlocked ? `<button class="stat-btn plus" onclick="updateStat(${p.id}, 'yellow', 1)">+</button>` : ''}
                        </div>
                    </div>
                    <div class="stats-row">
                        <span class="stat-label">🟥 Kırmızı Kart</span>
                        <div class="stat-controls">
                            ${isUnlocked ? `<button class="stat-btn minus" onclick="updateStat(${p.id}, 'red', -1)">-</button>` : ''}
                            <span class="stat-value">${p.redCards || 0}</span>
                            ${isUnlocked ? `<button class="stat-btn plus" onclick="updateStat(${p.id}, 'red', 1)">+</button>` : ''}
                        </div>
                    </div>

                    ${isUnlocked ? `
                        <div class="mvp-select-box">
                            <span>Maçın Adamı (MVP) Yap</span>
                            <button onclick="setMvp(${p.id})">${p.isMvp ? 'Seçili' : 'Seç'}</button>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function renderMatches() {
            const container = document.getElementById('matches-list');
            if (matches.length === 0) {
                container.innerHTML = '<div style="font-size:0.85rem; color:#888;">Henüz maç verisi girilmedi.</div>';
                return;
            }
            container.innerHTML = matches.map(m => `
                <div class="match-item">
                    <div>
                        <strong>FC BAD BOYS vs ${m.opponent}</strong>
                        <div style="font-size:0.75rem; color:#aaa;">${m.date}</div>
                    </div>
                    <div class="match-score">${m.score}</div>
                </div>
            `).join('');
        }

        function renderVoting() {
            const container = document.getElementById('vote-container');
            const winnerDisplay = document.getElementById('winner-display');
            const voteStatus = document.getElementById('vote-status');
            const myVotedId = localStorage.getItem("badboys_voted_id");

            let maxVotes = -1;
            let winner = null;
            players.forEach(p => {
                const count = votes[p.id] || 0;
                if (count > maxVotes && count > 0) {
                    maxVotes = count;
                    winner = p;
                }
            });

            if (votingClosed) {
                if (winner) {
                    const formattedName = `👑 ${winner.name.toUpperCase()} 👑`;
                    winnerDisplay.innerHTML = `<div class="winner-banner">${formattedName}</div>`;
                } else {
                    winnerDisplay.innerHTML = `<div class="winner-banner">👑 KAZANAN BELİRLENEMEDİ 👑</div>`;
                }
                voteStatus.textContent = "Haftanın oyuncusu oylaması tamamlandı!";
            } else {
                winnerDisplay.innerHTML = '';
                voteStatus.textContent = myVotedId 
                    ? "Oyunuz kaydedildi. İsterseniz aşağıdaki butonlardan başka bir oyuncuya tıklayarak oyunuzu değiştirebilirsiniz." 
                    : "Herkesin 1 oy hakkı vardır. Oyunuzu dilediğiniz zaman değiştirebilirsiniz.";
            }

            container.innerHTML = players.map(p => {
                const count = votes[p.id] || 0;
                const isMyVote = myVotedId && parseInt(myVotedId) === p.id;
                
                return `
                    <div class="vote-card ${isMyVote ? 'voted-active' : ''}">
                        <div>
                            <strong>${p.name}</strong>
                            <div style="font-size:0.8rem; color:var(--primary-orange); margin-top:2px;">Oy: ${count}</div>
                        </div>
                        <button class="vote-btn ${isMyVote ? 'voted-btn' : ''}" 
                            ${votingClosed ? 'disabled' : ''} 
                            onclick="castVote(${p.id})">
                            ${votingClosed ? 'Kapandı' : (isMyVote ? 'Oyunuz (Değiştir)' : 'Oy Ver')}
                        </button>
                    </div>
                `;
            }).join('');

            // Oylama kontrol butonlarını oylama alanının altına güvenli şekilde yerleştiriyoruz
            let adminBottomDiv = document.getElementById('admin-controls-bottom-container');
            if (!adminBottomDiv) {
                adminBottomDiv = document.createElement('div');
                adminBottomDiv.id = 'admin-controls-bottom-container';
                document.getElementById('vote-container').parentNode.appendChild(adminBottomDiv);
            }

            if (isUnlocked) {
                adminBottomDiv.innerHTML = `
                    <div class="admin-controls-bottom">
                        <div style="font-size:0.75rem; color:#aaa; text-align:center;">Oylama Kontrol Paneli</div>
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <button class="admin-btn ${votingClosed ? 'btn-toggle-open' : 'btn-toggle-close'}" onclick="toggleVotingState()">
                                ${votingClosed ? 'Oylamayı Tekrar Aç' : 'Oylamayı Bitir'}
                            </button>
                        </div>
                    </div>
                `;
            } else {
                adminBottomDiv.innerHTML = '';
            }
        }

        function renderLeaderboards() {
            const topScorers = [...players]
                .filter(p => !p.isGoalKeeper)
                .sort((a, b) => (b.goals || 0) - (a.goals || 0))
                .slice(0, 5);

            const topAssists = [...players]
                .filter(p => !p.isGoalKeeper)
                .sort((a, b) => (b.assists || 0) - (a.assists || 0))
                .slice(0, 5);

            document.getElementById('top-scorers').innerHTML = topScorers.map((p, index) => `
                <div class="rank-row">
                    <span>${index + 1}. ${p.name}</span>
                    <strong>${p.goals || 0} Gol</strong>
                </div>
            `).join('');

            document.getElementById('top-assists').innerHTML = topAssists.map((p, index) => `
                <div class="rank-row">
                    <span>${index + 1}. ${p.name}</span>
                    <strong>${p.assists || 0} Asist</strong>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
