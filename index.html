<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC BAD BOYS</title>
    <style>
        :root {
            --primary-orange: #FF6600;
            --dark-black: #121212;
            --card-bg: #1E1E1E;
            --text-light: #F4F4F4;
            --accent-gray: #2A2A2A;
            --danger: #FF4444;
            --success: #00C851;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-black);
            color: var(--text-light);
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-orange);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--primary-orange);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .auth-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--primary-orange);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .auth-box input {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .auth-box button {
            padding: 8px 15px;
            background-color: var(--primary-orange);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-box button:hover {
            opacity: 0.9;
        }

        #status-msg {
            font-size: 0.85rem;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .players-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .players-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border-left: 5px solid var(--primary-orange);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .player-number {
            background: var(--primary-orange);
            color: #fff;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .player-details {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-gray);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-btn {
            background: #444;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .stat-btn:active {
            transform: scale(0.95);
        }

        .stat-btn.plus {
            background-color: var(--success);
        }

        .stat-btn.minus {
            background-color: var(--danger);
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .locked-notice {
            font-size: 0.75rem;
            color: var(--danger);
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>FC BAD BOYS</h1>
    </header>

    <div class="auth-box">
        <input type="password" id="password-input" placeholder="Kaptan Şifresi">
        <button onclick="unlockPanel()">Kilidi Aç</button>
        <div id="status-msg" style="color: var(--danger);">Kilitli: Sadece düzenleme yapabilirsiniz.</div>
    </div>

    <div class="players-container" id="players-list">
        <!-- Oyuncular JavaScript ile dinamik yüklenecek -->
    </div>

    <script>
        // Başlangıç Oyuncu Verileri
        const initialPlayers = [
            { id: 1, name: "Eren Yılmaz", position: "Forvet", number: 37, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 2, name: "Murat Çaylı", position: "Forvet", number: 10, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 3, name: "Hüseyin Can Yüksekdağ", position: "Kale", number: 1, goalsConceded: 0, isGoalKeeper: true },
            { id: 4, name: "Yakup Sunay", position: "Defans", number: 5, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 5, name: "Süleyman Tunçelik", position: "Defans", number: 3, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 6, name: "Musa Aksu", position: "Kanat", number: 37, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 7, name: "Burak Yavuz", position: "Defans", number: 4, goals: 0, assists: 0, isGoalKeeper: false },
            { id: 8, name: "Ahmet", position: "Kale", number: 99, goalsConceded: 0, isGoalKeeper: true }
        ];

        let isUnlocked = false;

        // Verileri localStorage'dan çekme veya ilk yükleme
        function getPlayersData() {
            const savedData = localStorage.getItem('takim_istatistikleri');
            if (savedData) {
                return JSON.parse(savedData);
            }
            return initialPlayers;
        }

        let players = getPlayersData();

        function saveData() {
            localStorage.setItem('takim_istatistikleri', JSON.stringify(players));
        }

        function unlockPanel() {
            const pass = document.getElementById('password-input').value;
            const msg = document.getElementById('status-msg');

            if (pass === "Yy++1907") {
                isUnlocked = true;
                msg.style.color = "var(--success)";
                msg.textContent = "Kilit Açıldı! Değişiklik yapabilirsiniz.";
                renderPlayers();
            } else {
                alert("Hatalı Şifre!");
                document.getElementById('password-input').value = "";
            }
        }

        function updateStat(id, statType, change) {
            if (!isUnlocked) {
                alert("Önce kaptan şifresiyle kilidi açmalısınız!");
                return;
            }

            const player = players.find(p => p.id === id);
            if (player) {
                if (statType === 'goals') {
                    player.goals = Math.max(0, player.goals + change);
                } else if (statType === 'assists') {
                    player.assists = Math.max(0, player.assists + change);
                } else if (statType === 'conceded') {
                    player.goalsConceded = Math.max(0, player.goalsConceded + change);
                }
                saveData();
                renderPlayers();
            }
        }

        function renderPlayers() {
            const container = document.getElementById('players-list');
            container.innerHTML = "";

            players.forEach(player => {
                let statsHTML = "";

                if (player.isGoalKeeper) {
                    statsHTML = `
                        <div class="stats-row">
                            <span class="stat-label">Yediği Gol:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'conceded', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.goalsConceded}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'conceded', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>
                    `;
                } else {
                    statsHTML = `
                        <div class="stats-row">
                            <span class="stat-label">Gol:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'goals', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.goals}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'goals', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>
                        <div class="stats-row">
                            <span class="stat-label">Asist:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'assists', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.assists}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'assists', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = 'player-card';
                card.innerHTML = `
                    <div class="player-header">
                        <span class="player-name">${player.name}</span>
                        <span class="player-number">${player.number}</span>
                    </div>
                    <div class="player-details">Mevki: ${player.position}</div>
                    ${statsHTML}
                    ${!isUnlocked ? '<div class="locked-notice">Düzenlemek için kilit açılmalıdır</div>' : ''}
                `;
                container.appendChild(card);
            });
        }

        // Sayfa açıldığında kartları listele
        renderPlayers();
    </script>
</body>
</html>
