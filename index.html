<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC BAD BOYS</title>
    
    <!-- Firebase SDK Kütüphaneleri -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-orange: #FF6600;
            --dark-black: #121212;
            --card-bg: #1E1E1E;
            --text-light: #F4F4F4;
            --accent-gray: #2A2A2A;
            --danger: #FF4444;
            --success: #00C851;
            --warning: #ffbb00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark-black);
            color: var(--text-light);
            padding: 15px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary-orange);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--primary-orange);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .team-summary {
            background: var(--card-bg);
            border: 1px solid var(--accent-gray);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .summary-item {
            font-size: 0.85rem;
            color: #aaa;
        }

        .summary-item span {
            display: block;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-orange);
        }

        .auth-box {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--primary-orange);
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .auth-box input {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .auth-box button {
            padding: 8px 15px;
            background-color: var(--primary-orange);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .auth-box button:hover {
            opacity: 0.9;
        }

        .admin-controls {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-reset {
            background-color: var(--danger);
            color: white;
        }

        #status-msg {
            font-size: 0.85rem;
            font-weight: bold;
            width: 100%;
            text-align: center;
        }

        .players-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .players-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .player-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border-left: 5px solid var(--primary-orange);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .player-card.mvp {
            border-left-color: var(--warning);
            background: linear-gradient(145deg, #1e1e1e, #262212);
        }

        .mvp-badge {
            position: absolute;
            top: 15px;
            right: 50px;
            background: var(--warning);
            color: #000;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .player-number {
            background: var(--primary-orange);
            color: #fff;
            padding: 2px 8px;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .player-details {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-gray);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .stat-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-btn {
            background: #444;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .stat-btn:active {
            transform: scale(0.95);
        }

        .stat-btn.plus {
            background-color: var(--success);
        }

        .stat-btn.minus {
            background-color: var(--danger);
        }

        .stat-value {
            font-size: 1rem;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .yellow-card-indicator {
            display: inline-block;
            width: 10px;
            height: 14px;
            background: #ffeb3b;
            border-radius: 2px;
            margin-right: 3px;
            vertical-align: middle;
        }

        .red-card-indicator {
            display: inline-block;
            width: 10px;
            height: 14px;
            background: var(--danger);
            border-radius: 2px;
            margin-right: 3px;
            vertical-align: middle;
        }

        .locked-notice {
            font-size: 0.75rem;
            color: var(--danger);
            text-align: center;
            margin-top: 10px;
        }

        .mvp-select-box {
            margin-top: 10px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 6px 10px;
            border-radius: 4px;
        }

        .mvp-select-box button {
            background: var(--warning);
            border: none;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            color: #000;
            font-size: 0.75rem;
        }

        /* YENİ EKLENEN BÖLÜMLERİN TASARIMI (Alt Alan) */
        .section-container {
            background: var(--card-bg);
            border: 1px solid var(--accent-gray);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            color: var(--primary-orange);
            font-size: 1.1rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--accent-gray);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Maç Sonuçları Listesi */
        .match-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-gray);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .match-score {
            font-weight: bold;
            background: var(--primary-orange);
            color: white;
            padding: 3px 10px;
            border-radius: 4px;
        }

        /* Herkese Açık Oylama */
        .vote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
        }
        .vote-card {
            background: var(--accent-gray);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 6px;
        }
        .vote-btn {
            background-color: var(--warning);
            color: #000;
            border: none;
            padding: 5px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .vote-btn:hover { opacity: 0.9; }

        /* Liderlik Tablosu (Gol/Asist Krallığı) */
        .rank-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 10px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 0.85rem;
        }
        .rank-row:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <header>
        <h1>FC BAD BOYS</h1>
    </header>

    <div class="team-summary" id="team-summary"></div>

    <div class="auth-box">
        <input type="password" id="password-input" placeholder="Kaptan Şifresi">
        <button onclick="unlockPanel()">Kilidi Aç</button>
        <div id="status-msg" style="color: var(--danger);">Kilitli: Sadece düzenleme yapabilirsiniz.</div>
        <div class="admin-controls" id="admin-controls" style="display: none;">
            <button class="admin-btn btn-reset" onclick="resetSeason()">Sezonu Sıfırla</button>
        </div>
    </div>

    <div class="players-container" id="players-list"></div>

    <!-- ALT KISIM: YENİ EKLENEN ÖZELLİKLER -->
    
    <!-- 2 Numaralı İstek: Maç Sonuçları ve Skor Arşivi -->
    <div class="section-container">
        <div class="section-title">
            <span>⚽ Maç Skorları & Fikstür</span>
            <button class="admin-btn" id="add-match-btn" style="display:none; background:var(--primary-orange); color:white;" onclick="addMatchModal()">+ Maç Ekle</button>
        </div>
        <div id="matches-list">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <!-- 4 Numaralı İstek: Herkese Açık Oylama Alanı (1 Oy Hakkı) -->
    <div class="section-container">
        <div class="section-title">⭐ Haftanın Oyuncusu Oylaması</div>
        <div id="vote-status" style="font-size:0.85rem; margin-bottom:10px; color:#aaa;">Her cihazın/tarayıcının 1 oy hakkı vardır.</div>
        <div class="vote-grid" id="vote-container">
            <!-- JavaScript ile doldurulacak -->
        </div>
    </div>

    <!-- 6 Numaralı İstek: Gol ve Asist Krallığı (Liderlik Tablosu) -->
    <div class="section-container">
        <div class="section-title">👑 Gol ve Asist Krallığı</div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <h4 style="font-size:0.9rem; color:var(--primary-orange); margin-bottom:8px;">⚽ Gol Krallığı</h4>
                <div id="top-scorers" style="background:var(--accent-gray); border-radius:6px; padding:5px;"></div>
            </div>
            <div>
                <h4 style="font-size:0.9rem; color:var(--primary-orange); margin-bottom:8px;">🎯 Asist Krallığı</h4>
                <div id="top-assists" style="background:var(--accent-gray); border-radius:6px; padding:5px;"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCSw0nzgbHrFCAJLpvmhZwYAV_aQeBMw4g",
            authDomain: "fcbadboys-bfc96.firebaseapp.com",
            projectId: "fcbadboys-bfc96",
            storageBucket: "fcbadboys-bfc96.firebasestorage.app",
            messagingSenderId: "394322712916",
            appId: "1:394322712916:web:8fb96c51cbf2f113e8d0c1",
            measurementId: "G-WT2ECTZ2K0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const initialPlayers = [
            { id: 1, name: "Eren Yılmaz", position: "Forvet", number: 37, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 2, name: "Murat Çaylı", position: "Forvet", number: 10, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 3, name: "Hüseyin Can Yüksekdağ", position: "Kale", number: 1, goalsConceded: 0, yellowCards: 0, redCards: 0, isGoalKeeper: true, isMvp: false },
            { id: 4, name: "Yakup Sunay", position: "Defans", number: 5, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 5, name: "Süleyman Tunçelik", position: "Defans", number: 3, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 6, name: "Musa Aksu", position: "Kanat", number: 37, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 7, name: "Burak Yavuz", position: "Defans", number: 4, goals: 0, assists: 0, yellowCards: 0, redCards: 0, isGoalKeeper: false, isMvp: false },
            { id: 8, name: "Ahmet", position: "Kale", number: 99, goalsConceded: 0, yellowCards: 0, redCards: 0, isGoalKeeper: true, isMvp: false }
        ];

        const initialMatches = [
            { opponent: "Rakip Takım 1", score: "4 - 2", date: "12.10.2026", status: "Kazandı" },
            { opponent: "Rakip Takım 2", score: "3 - 3", date: "19.10.2026", status: "Berabere" }
        ];

        let isUnlocked = false;
        let players = [];
        let matches = [];
        let votes = {}; // Oy sayılarını tutar

        // Firebase Veri Senkronizasyonu
        db.ref('players').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { players = data; } 
            else { db.ref('players').set(initialPlayers); players = initialPlayers; }
            renderAll();
        });

        db.ref('matches').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) { matches = data; } 
            else { db.ref('matches').set(initialMatches); matches = initialMatches; }
            renderMatches();
        });

        db.ref('votes').on('value', (snapshot) => {
            votes = snapshot.val() || {};
            renderVoting();
        });

        function saveData() {
            db.ref('players').set(players);
        }

        function unlockPanel() {
            const pass = document.getElementById('password-input').value;
            const msg = document.getElementById('status-msg');
            const adminControls = document.getElementById('admin-controls');
            const addMatchBtn = document.getElementById('add-match-btn');

            if (pass === "Yy++1907") {
                isUnlocked = true;
                msg.style.color = "var(--success)";
                msg.textContent = "Kilit Açıldı! Değişiklik yapabilirsiniz.";
                adminControls.style.display = "flex";
                addMatchBtn.style.display = "inline-block";
                renderAll();
            } else {
                alert("Hatalı Şifre!");
                document.getElementById('password-input').value = "";
            }
        }

        function resetSeason() {
            if (confirm("Tüm oyuncu istatistikleri ve MVP seçimi sıfırlanacak. Emin misiniz?")) {
                players = initialPlayers.map(p => ({ ...p }));
                saveData();
                db.ref('votes').remove();
                alert("Sezon başarıyla sıfırlandı!");
            }
        }

        function updateStat(id, statType, change) {
            if (!isUnlocked) {
                alert("Önce kaptan şifresiyle kilidi açmalısınız!");
                return;
            }

            const player = players.find(p => p.id === id);
            if (player) {
                if (statType === 'goals') player.goals = Math.max(0, player.goals + change);
                else if (statType === 'assists') player.assists = Math.max(0, player.assists + change);
                else if (statType === 'conceded') player.goalsConceded = Math.max(0, player.goalsConceded + change);
                else if (statType === 'yellow') player.yellowCards = Math.max(0, player.yellowCards + change);
                else if (statType === 'red') player.redCards = Math.max(0, player.redCards + change);
                
                saveData();
            }
        }

        function setMvp(id) {
            if (!isUnlocked) return;
            players.forEach(p => p.isMvp = (p.id === id));
            saveData();
        }

        // Maç Ekleme Fonksiyonu (Kaptan Yetkili)
        function addMatchModal() {
            const opponent = prompt("Rakip Takım Adı:");
            if (!opponent) return;
            const score = prompt("Skor (Örn: 5 - 2):");
            if (!score) return;
            const date = prompt("Maç Tarihi (Örn: 25.10.2026):", "Bugün");

            matches.push({ opponent, score, date });
            db.ref('matches').set(matches);
        }

        // Herkese Açık Oylama Sistemi (Lokal Storage ile 1 Oy Sınırı)
        function castVote(playerId) {
            if (localStorage.getItem("badboys_voted")) {
                alert("Zaten daha önce oy kullandınız! Her cihazın 1 oy hakkı vardır.");
                return;
            }

            db.ref('votes/' + playerId).transaction((currentVotes) => {
                return (currentVotes || 0) + 1;
            }, (error, committed) => {
                if (committed) {
                    localStorage.setItem("badboys_voted", "true");
                    alert("Oylamanız başarıyla kaydedildi!");
                }
            });
        }

        function renderAll() {
            renderSummary();
            renderPlayers();
            renderLeaderboards();
        }

        function renderSummary() {
            let totalGoals = players.reduce((sum, p) => sum + (p.goals || 0), 0);
            let totalAssists = players.reduce((sum, p) => sum + (p.assists || 0), 0);
            let totalConceded = players.reduce((sum, p) => sum + (p.goalsConceded || 0), 0);
            let totalYellow = players.reduce((sum, p) => sum + (p.yellowCards || 0), 0);
            let totalRed = players.reduce((sum, p) => sum + (p.redCards || 0), 0);

            document.getElementById('team-summary').innerHTML = `
                <div class="summary-item">Toplam Gol<span>⚽ ${totalGoals}</span></div>
                <div class="summary-item">Toplam Asist<span>🎯 ${totalAssists}</span></div>
                <div class="summary-item">Yenen Gol<span>🥅 ${totalConceded}</span></div>
                <div class="summary-item">Kartlar<span><span class="yellow-card-indicator"></span>${totalYellow} <span class="red-card-indicator"></span>${totalRed}</span></div>
            `;
        }

        function renderPlayers() {
            const container = document.getElementById('players-list');
            container.innerHTML = "";

            players.forEach(player => {
                let statsHTML = "";
                if (player.isGoalKeeper) {
                    statsHTML = `
                        <div class="stats-row">
                            <span class="stat-label">Yediği Gol:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'conceded', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.goalsConceded}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'conceded', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>`;
                } else {
                    statsHTML = `
                        <div class="stats-row">
                            <span class="stat-label">Gol:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'goals', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.goals}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'goals', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>
                        <div class="stats-row">
                            <span class="stat-label">Asist:</span>
                            <div class="stat-controls">
                                <button class="stat-btn minus" onclick="updateStat(${player.id}, 'assists', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                                <span class="stat-value">${player.assists}</span>
                                <button class="stat-btn plus" onclick="updateStat(${player.id}, 'assists', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                            </div>
                        </div>`;
                }

                statsHTML += `
                    <div class="stats-row">
                        <span class="stat-label"><span class="yellow-card-indicator"></span> Sarı Kart:</span>
                        <div class="stat-controls">
                            <button class="stat-btn minus" onclick="updateStat(${player.id}, 'yellow', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                            <span class="stat-value">${player.yellowCards || 0}</span>
                            <button class="stat-btn plus" onclick="updateStat(${player.id}, 'yellow', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                        </div>
                    </div>
                    <div class="stats-row">
                        <span class="stat-label"><span class="red-card-indicator"></span> Kırmızı Kart:</span>
                        <div class="stat-controls">
                            <button class="stat-btn minus" onclick="updateStat(${player.id}, 'red', -1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>-</button>
                            <span class="stat-value">${player.redCards || 0}</span>
                            <button class="stat-btn plus" onclick="updateStat(${player.id}, 'red', 1)" ${!isUnlocked ? 'disabled style="opacity:0.5"' : ''}>+</button>
                        </div>
                    </div>`;

                const card = document.createElement('div');
                card.className = `player-card ${player.isMvp ? 'mvp' : ''}`;
                
                let mvpSection = isUnlocked ? `
                    <div class="mvp-select-box">
                        <span>Haftanın Yıldızı (MVP)</span>
                        <button onclick="setMvp(${player.id})">${player.isMvp ? '⭐ Seçildi' : 'Seç'}</button>
                    </div>` : "";

                card.innerHTML = `
                    ${player.isMvp ? '<div class="mvp-badge">⭐ MVP</div>' : ''}
                    <div class="player-header">
                        <span class="player-name">${player.name}</span>
                        <span class="player-number">${player.number}</span>
                    </div>
                    <div class="player-details"><span>Mevki: ${player.position}</span></div>
                    ${statsHTML}
                    ${mvpSection}
                    ${!isUnlocked ? '<div class="locked-notice">Düzenlemek için kilit açılmalıdır</div>' : ''}
                `;
                container.appendChild(card);
            });
        }

        function renderMatches() {
            const container = document.getElementById('matches-list');
            container.innerHTML = "";
            matches.forEach(m => {
                container.innerHTML += `
                    <div class="match-item">
                        <span><b>FC Bad Boys</b> vs ${m.opponent} <small style="color:#aaa;">(${m.date})</small></span>
                        <span class="match-score">${m.score}</span>
                    </div>`;
            });
        }

        function renderVoting() {
            const container = document.getElementById('vote-container');
            container.innerHTML = "";
            const hasVoted = localStorage.getItem("badboys_voted");

            if (hasVoted) {
                document.getElementById('vote-status').innerHTML = "✅ Oyunuz başarıyla kaydedildi. Teşekkürler!";
            }

            players.forEach(p => {
                let voteCount = votes[p.id] || 0;
                container.innerHTML += `
                    <div class="vote-card">
                        <div><b>${p.name}</b><br><small style="color:#aaa">${voteCount} Oy</small></div>
                        <button class="vote-btn" onclick="castVote(${p.id})" ${hasVoted ? 'disabled style="background:#555; cursor:not-allowed;"' : ''}>Oy Ver</button>
                    </div>`;
            });
        }

        function renderLeaderboards() {
            // Sadece kaleci olmayanları filtrele ve sırala
            const outfield = players.filter(p => !p.isGoalKeeper);
            
            const topScorersList = [...outfield].sort((a, b) => b.goals - a.goals).slice(0, 5);
            const topAssistsList = [...outfield].sort((a, b) => b.assists - a.assists).slice(0, 5);

            let scorerHTML = "";
            topScorersList.forEach((p, idx) => {
                scorerHTML += `<div class="rank-row"><span>${idx+1}. ${p.name}</span><strong>⚽ ${p.goals}</strong></div>`;
            });
            document.getElementById('top-scorers').innerHTML = scorerHTML || '<div style="padding:8px; text-align:center; font-size:0.8rem;">Veri yok</div>';

            let assistHTML = "";
            topAssistsList.forEach((p, idx) => {
                assistHTML += `<div class="rank-row"><span>${idx+1}. ${p.name}</span><strong>🎯 ${p.assists}</strong></div>`;
            });
            document.getElementById('top-assists').innerHTML = assistHTML || '<div style="padding:8px; text-align:center; font-size:0.8rem;">Veri yok</div>';
        }
    </script>
</body>
</html>
